name: Build CreatorLab APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q CreatorLab-Android-Source.zip

      - name: Inspect source before build
        run: |
          echo '=== SOURCE FILES ==='
          find CreatorLab -maxdepth 8 -type f | sort
          echo '=== MAIN ACTIVITY ==='
          sed -n '1,260p' CreatorLab/app/src/main/java/com/creatorlab/app/MainActivity.kt
          echo '=== APP GRADLE ==='
          cat CreatorLab/app/build.gradle.kts
          echo '=== MANIFEST ==='
          cat CreatorLab/app/src/main/AndroidManifest.xml

      - name: Patch selectable result text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CreatorLab/app/src/main/java/com/creatorlab/app/MainActivity.kt")
          s = p.read_text()
          s = s.replace(
              "                    SelectionContainer { Text(result, color = Ink, fontSize = 13.sp, lineHeight = 21.sp) }",
              "                    Text(result, color = Ink, fontSize = 13.sp, lineHeight = 21.sp)"
          )
          s = "\n".join(line for line in s.splitlines() if "SelectionContainer" not in line) + "\n"
          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: CreatorLab
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorLab-debug-apk
          path: CreatorLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
